<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy comparison</title>
  <desc id="desc">Teacher-label agreement on customer_service test, n=100, seed=42. Jev 78%, majority 49%, GLiClass 40%.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .title { fill: #1f2328; font: 700 22px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .sub { fill: #656d76; font: 400 13px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .label { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .pct { fill: #1f2328; font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .axis { stroke: #d0d7de; stroke-width: 1; }
      .guide { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 4; }
      .guide-label { fill: #656d76; font: 500 11px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .bar-jev { fill: #1a7f37; }
      .bar-maj { fill: #9a6700; }
      .bar-gli { fill: #cf222e; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .title, .label, .pct { fill: #e6edf3; }
        .sub, .guide-label { fill: #8b949e; }
        .axis, .guide { stroke: #30363d; }
        .bar-jev { fill: #3fb950; }
        .bar-maj { fill: #d29922; }
        .bar-gli { fill: #f85149; }
      }
    </style>
  </defs>
  <rect class="bg" width="920" height="340" rx="12"/>
  <rect class="card" x="24" y="24" width="872" height="292" rx="10"/>
  <text class="title" x="48" y="64">Teacher agreement (accuracy)</text>
  <text class="sub" x="48" y="88">customer_service · test · n=100 · seed=42 · higher is better</text>

  <!-- 70% strong band guide -->
  <line class="guide" x1="220" y1="120" x2="220" y2="280"/>
  <text class="guide-label" x="214" y="112" text-anchor="middle">strong ~70%</text>

  <!-- track background -->
  <rect x="48" y="130" width="700" height="28" rx="6" fill="#00000010"/>
  <rect x="48" y="180" width="700" height="28" rx="6" fill="#00000010"/>
  <rect x="48" y="230" width="700" height="28" rx="6" fill="#00000010"/>

  <!-- bars: 700px = 100% -->
  <rect class="bar-jev" x="48" y="130" width="546" height="28" rx="6"/>
  <rect class="bar-maj" x="48" y="180" width="344" height="28" rx="6"/>
  <rect class="bar-gli" x="48" y="230" width="277" height="28" rx="6"/>

  <text class="label" x="48" y="122">Jev</text>
  <text class="pct" x="780" y="150">78.0%</text>

  <text class="label" x="48" y="172">Majority baseline</text>
  <text class="pct" x="780" y="200">49.2%</text>

  <text class="label" x="48" y="222">GLiClass</text>
  <text class="pct" x="780" y="250">39.6%</text>

  <text class="sub" x="48" y="290">Gold replay (sanity) = 100%. Latency not shown: Jev is remote API, GLiClass is local CPU.</text>
</svg>
