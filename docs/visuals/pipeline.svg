<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">How the bench works</title>
  <desc id="desc">Pipeline from tickets to scored comparison.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .box-accent { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .title { fill: #1f2328; font: 700 22px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .h { fill: #1f2328; font: 700 14px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .p { fill: #656d76; font: 400 12px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
      .arrow { stroke: #656d76; stroke-width: 2; fill: none; marker-end: url(#m); }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .box { fill: #0d1117; stroke: #30363d; }
        .box-accent { fill: #12253d; stroke: #388bfd; }
        .title, .h { fill: #e6edf3; }
        .p { fill: #8b949e; }
        .arrow { stroke: #8b949e; }
      }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#656d76"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="300" rx="12"/>
  <rect class="card" x="24" y="24" width="872" height="252" rx="10"/>
  <text class="title" x="48" y="64">How a run works</text>

  <rect class="box" x="48" y="100" width="150" height="110" rx="10"/>
  <text class="h" x="123" y="140" text-anchor="middle">1. Tickets</text>
  <text class="p" x="123" y="162" text-anchor="middle">100 support cases</text>
  <text class="p" x="123" y="180" text-anchor="middle">+ 5 questions each</text>
  <text class="p" x="123" y="198" text-anchor="middle">seeded sample</text>

  <path class="arrow" d="M210 155 H250"/>

  <rect class="box-accent" x="260" y="100" width="170" height="110" rx="10"/>
  <text class="h" x="345" y="140" text-anchor="middle">2. Ask models</text>
  <text class="p" x="345" y="162" text-anchor="middle">Jev: all Qs at once</text>
  <text class="p" x="345" y="180" text-anchor="middle">GLiClass: one Q each</text>
  <text class="p" x="345" y="198" text-anchor="middle">same rows, same schema</text>

  <path class="arrow" d="M442 155 H482"/>

  <rect class="box" x="492" y="100" width="170" height="110" rx="10"/>
  <text class="h" x="577" y="140" text-anchor="middle">3. Compare</text>
  <text class="p" x="577" y="162" text-anchor="middle">vs teacher labels</text>
  <text class="p" x="577" y="180" text-anchor="middle">accuracy · log loss</text>
  <text class="p" x="577" y="198" text-anchor="middle">Brier · McNemar</text>

  <path class="arrow" d="M674 155 H714"/>

  <rect class="box" x="724" y="100" width="148" height="110" rx="10"/>
  <text class="h" x="798" y="140" text-anchor="middle">4. Publish</text>
  <text class="p" x="798" y="162" text-anchor="middle">summary.json</text>
  <text class="p" x="798" y="180" text-anchor="middle">+ prediction files</text>
  <text class="p" x="798" y="198" text-anchor="middle">reproducible</text>
</svg>
