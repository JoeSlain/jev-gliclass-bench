[project]
name = "jev-gliclass-bench"
version = "0.1.0"
description = "Head-to-head harness: TypeSafe Jev vs Knowledgator GLiClass on LocalLLaMA/typed-decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=3.0.0",
  "huggingface-hub>=0.26.0",
  "numpy>=2.0.0",
  "transformers>=4.45.0",
  "torch>=2.4.0",
  "typesafe-sdk>=0.0.1a0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
gliclass = []

[project.scripts]
jev-gliclass-bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.hatch.build.targets.wheel.sources]
"src/bench" = "bench"
